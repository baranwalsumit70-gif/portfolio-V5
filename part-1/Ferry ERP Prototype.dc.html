<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;height:100%;font-family:"Inter",system-ui,sans-serif;color:#111;background:#F7F8FA}a{color:#032B51}a:hover{color:#0B4A85}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"></link></helmet>
<div style="height:100vh;display:flex;flex-direction:column;min-width:0">
  <div style="display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;background:#82C1E0;flex:none">
    <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0A7A3B">IWT</span>
    <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700;color:#032B51">Ferry Management System</span><span style="font-size:11px;letter-spacing:.04em;color:#FFFFFF">INLAND WATER TRANSPORT</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:20px;height:40px;padding:0 20px;background:#032B51;color:#FFFFFF;font-size:13px;flex:none">
    <span style="flex:1;font-variant-numeric:tabular-nums">{{ clock }}</span>
    <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;background:#DDFBE9;color:#0A7A3B;font-size:12px;font-weight:500"><span style="width:8px;height:8px;border-radius:50%;background:#16A34A"></span>System Online</span>
    <span style="display:inline-flex;align-items:center;gap:8px"><span style="width:24px;height:24px;border-radius:50%;background:#FFFFFF;color:#1D4ED8;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">FA</span>Admin</span>
  </div>
  <div style="flex:1;display:flex;min-height:0">
    <nav aria-label="Modules" style="width:230px;flex:none;display:flex;flex-direction:column;gap:4px;padding:16px 12px;background:#FFFFFF;border-right:1px solid #E6E8EC;overflow-y:auto">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
        <button onClick="{{ n.go }}" aria-current="{{ n.cur }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 14px;border:0;border-radius:8px;background:{{ n.bg }};color:{{ n.fg }};font:inherit;font-size:14px;font-weight:{{ n.fw }};text-align:left;cursor:pointer" style-hover="background:{{ n.hov }}">{{ n.label }}<span style="opacity:{{ n.chev }}">›</span></button>
      </sc-for>
      <div style="height:1px;background:#E6E8EC;margin:10px 4px"></div>
      <sc-for list="{{ off }}" as="o" hint-placeholder-count="3">
        <span style="display:flex;align-items:center;height:38px;padding:0 14px;font-size:14px;color:#9AA0A6">{{ o }}</span>
      </sc-for>
    </nav>
    <main data-lenis-prevent="" style="flex:1;min-width:0;overflow-y:auto;padding:24px">
      <div style="max-width:1100px;margin:0 auto;background:#FFFFFF;border:1px solid #E6E8EC;border-radius:14px;overflow:hidden">
        <img src="{{ cur.src }}" alt="{{ cur.label }} screen" style="display:block;width:100%;height:auto"></img>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  SCREENS = [["Dashboard", "assets/ferry-dashboard-content.webp"], ["Ticketing", "assets/ferry-ticketing-content.webp"], ["Ferry Operations", "assets/ferry-ops.webp"], ["Terminals & Routes", "assets/ferry-routes.webp"], ["Revenue & Finance", "assets/ferry-revenue.webp"], ["Safety & Compliance", "assets/ferry-safety.webp"], ["Complaints & Feedback", "assets/ferry-complaints.webp"]];
  state = { i: 0, now: new Date() };
  componentDidMount() { this.t = setInterval(() => this.setState({ now: new Date() }), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state, d = s.now;
    const clock = d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + ",  " + d.toLocaleDateString("en-GB");
    return {
      clock,
      nav: this.SCREENS.map(([label], i) => { const on = s.i === i; return { label, cur: on ? "page" : "false", bg: on ? "#032B51" : "transparent", fg: on ? "#FFFFFF" : "#111111", fw: on ? 600 : 500, hov: on ? "#032B51" : "#F1F3F6", chev: on ? 1 : 0, go: () => { this.setState({ i }); const m = document.querySelector("main"); if (m) m.scrollTop = 0; } }; }),
      off: ["Reports", "Users & Roles", "System Settings"],
      cur: { label: this.SCREENS[s.i][0], src: this.SCREENS[s.i][1] }
    };
  }
}
</script>
</body>
</html>
